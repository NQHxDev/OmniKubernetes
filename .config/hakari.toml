# Hakari configuration for workspace dependency management
# https://docs.rs/cargo-hakari/latest/cargo_hakari/

# The hakari package is used to manage workspace-hack
hakari-package = "workspace-hack"

# Platforms to generate dependencies for
platforms = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Resolver version (should match workspace resolver)
resolver = "2"

# Don't output any workspace members
# (we want the workspace-hack to be separate)
output-single-feature = true
