# Hakari configuration for workspace dependency optimization
dep-format-version = "4"

hakari-package = "workspace-hack"

platforms = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Exclude workspace members that shouldn't be part of the unified build
# (e.g., standalone tools or packages not meant to be compiled together)
# workspace.members = []

# Additional CLI options for hakari
[cli]
# Don't output colors in CI
# color = "auto"
