name: Setup Rust Environment
description: Sets up the Rust toolchain with components and Cargo dependency caching.

inputs:
  toolchain:
    description: Rust toolchain version
    required: false
    default: stable
  components:
    description: Additional Rust components to install (e.g. rustfmt, clippy)
    required: false
    default: ""
  cache:
    description: Whether to enable Cargo caching
    required: false
    default: "true"
  cache-key:
    description: Shared key to isolate Cargo cache between jobs
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache Cargo dependencies
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
