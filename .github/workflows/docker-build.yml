name: Docker Build Test

on:
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".editorconfig"
      - ".prettierrc"
      - ".prettierignore"
      - ".markdownlint.json"
      - ".markdownlintignore"
  workflow_dispatch:
    inputs:
      service_name:
        description: "Microservice binary to build"
        required: false
        default: "gateway-service"
        type: choice
        options:
          - gateway-service
          - auth-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_NAME: ${{ inputs.service_name || 'gateway-service' }}

jobs:
  docker-build:
    name: Build & Verify (${{ inputs.service_name || 'gateway-service' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            SERVICE_NAME=${{ env.SERVICE_NAME }}
          tags: |
            omnikube:latest
            omnikube:${{ github.sha }}
          cache-from: type=gha,scope=omnikube-rust-docker
          cache-to: type=gha,mode=max,scope=omnikube-rust-docker

      - name: Verify image execution & size
        run: |
          echo "Docker Image Built Successfully..."
          docker images omnikube:latest
          IMAGE_SIZE_BYTES=$(docker image inspect omnikube:latest --format='{{.Size}}')
          echo "Image size: $(numfmt --to=iec-i --suffix=B "$IMAGE_SIZE_BYTES")"
          echo "Smoke Testing Container Binary..."
          docker run --rm omnikube:latest
