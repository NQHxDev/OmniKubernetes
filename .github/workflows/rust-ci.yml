name: Rust CI

on:
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache: "true"

      - name: Install cargo-hakari
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari

      - name: Check workspace dependencies
        run: cargo hakari generate --diff

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: Documentation Check
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Check documentation & intra-doc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  test:
    name: Workspace Tests
    needs: fmt
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni_user
          POSTGRES_PASSWORD: omni_password
          POSTGRES_DB: omni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OMNI_TEST_DATABASE_URL: postgres://omni_user:omni_password@localhost:5432/omni_test
      OMNI_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run workspace doc tests
        run: cargo test --workspace --doc --all-features

  audit:
    name: Security Audit
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit

  docker:
    name: Docker Build Test
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: omnikube:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: K8s Integration Tests
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust environment
        uses: ./.github/actions/setup-rust
        with:
          cache: "true"

      - name: Setup Kind cluster
        uses: helm/kind-action@v1

      - name: Run integration tests
        run: cargo test --test integration_k8s -- --include-ignored

  check-success:
    name: CI Success
    if: always()
    needs: [fmt, clippy, docs, test, audit, docker, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required CI jobs did not succeed..."
          exit 1

      - name: All checks passed
        run: echo "All checks passed..."
