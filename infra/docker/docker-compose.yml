# Local development environment for OmniKubernetes

networks:
  omni-network:
    name: omni-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  grafana_data:
  tempo_data:

services:
  # Storage & Cache Engines
  postgres:
    image: postgres:16-alpine
    container_name: omni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni_admin
      POSTGRES_PASSWORD: omni_dev_admin_password
      POSTGRES_DB: omni_default
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-init-common.sql:/docker-entrypoint-initdb.d/01-init-common.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    networks:
      - omni-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: omni-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--aclfile", "/etc/redis/users.acl"]
    volumes:
      - redis_data:/data
      - ./redis/users.acl:/etc/redis/users.acl:ro
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - omni-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "omni_admin_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: omni-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: omni
      RABBITMQ_DEFAULT_PASS: omni_rabbit_secret
      RABBITMQ_DEFAULT_VHOST: /omni
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Web Management UI
    networks:
      - omni-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Observability Stack
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: omni-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - omni-network

  loki:
    image: grafana/loki:2.9.4
    container_name: omni-loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - omni-network

  tempo:
    image: grafana/tempo:2.4.0
    container_name: omni-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - omni-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: omni-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/:ro
    ports:
      - "3000:3000"
    networks:
      - omni-network
    depends_on:
      - prometheus
      - loki
      - tempo

  # API Documentation Gateway
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: omni-swagger-ui
    restart: unless-stopped
    environment:
      CONFIG_URL: "/swagger-config.json"
      PERSIST_AUTHORIZATION: "true"
      DISPLAY_REQUEST_DURATION: "true"
    volumes:
      - ../kubernetes/configmaps/swagger-config.json:/usr/share/nginx/html/swagger-config.json:ro
    ports:
      - "8080:8080"
    networks:
      - omni-network
