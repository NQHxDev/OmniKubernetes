apiVersion: v1
kind: ConfigMap
metadata:
  name: swagger-ui-config
  namespace: omni-system
  labels:
    app.kubernetes.io/name: swagger-ui-config
    app.kubernetes.io/part-of: omni-platform
data:
  swagger-config.json: |
    {
      "urls": [
        {"name": "01. Auth & IAM Service", "url": "/api/v1/auth/v3/api-docs"},
        {"name": "02. User & Tenant Service", "url": "/api/v1/users/v3/api-docs"},
        {"name": "03. Order Processing Service", "url": "/api/v1/orders/v3/api-docs"},
        {"name": "04. Payment & Ledger Service", "url": "/api/v1/payments/v3/api-docs"},
        {"name": "05. Product & Catalog Service", "url": "/api/v1/products/v3/api-docs"},
        {"name": "06. Notification Service", "url": "/api/v1/notifications/v3/api-docs"}
      ],
      "layout": "StandaloneLayout",
      "deepLinking": true,
      "persistAuthorization": true,
      "displayRequestDuration": true,
      "filter": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui-aggregator
  namespace: omni-system
  labels:
    app.kubernetes.io/name: swagger-ui-aggregator
    app.kubernetes.io/part-of: omni-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-ui-aggregator
  template:
    metadata:
      labels:
        app: swagger-ui-aggregator
        app.kubernetes.io/name: swagger-ui-aggregator
    spec:
      containers:
        - name: swagger-ui
          image: swaggerapi/swagger-ui:v5.17.14
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONFIG_URL
              value: "/swagger-ui/config/swagger-config.json"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/swagger-ui/config
      volumes:
        - name: config-volume
          configMap:
            name: swagger-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-ui-service
  namespace: omni-system
  labels:
    app.kubernetes.io/name: swagger-ui-service
    app.kubernetes.io/part-of: omni-platform
spec:
  type: ClusterIP
  selector:
    app: swagger-ui-aggregator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

