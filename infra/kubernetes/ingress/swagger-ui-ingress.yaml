apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omni-swagger-ui-ingress
  namespace: omni-system
  labels:
    app.kubernetes.io/name: swagger-ui-ingress
    app.kubernetes.io/part-of: omni-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
    - host: api.omnikubernetes.com
      http:
        paths:
          # Route directly to Swagger UI Aggregator Pod (without rewrite)
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: swagger-ui-service
                port:
                  number: 8080
          # Optional catalog access
          - path: /swagger-config.json
            pathType: Exact
            backend:
              service:
                name: swagger-ui-service
                port:
                  number: 8080

