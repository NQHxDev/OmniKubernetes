[package]
name = "omni-database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Enterprise Relational Persistence Foundation with PostgreSQL and SQLx for OmniKubernetes"

[lints]
workspace = true

[features]
default = ["probes"]
probes = ["dep:omni-metrics"]

[dependencies]
omni-common = { workspace = true }
omni-errors = { workspace = true }
omni-metrics = { workspace = true, optional = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
