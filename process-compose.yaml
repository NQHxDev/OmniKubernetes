version: "0.5"

# Process Compose configuration for OmniKubernetes
# Docs: https://f1bonacc1.github.io/process-compose/

log_level: info
log_length: 3000

environment:
  - ENV=development

processes:
  placeholder-service:
    description: "Placeholder service for OmniKubernetes (replace with actual services later)"
    command: "echo 'OmniKubernetes placeholder service is ready!' && sleep 5"
    working_dir: "."
    availability:
      restart: "no"
    disabled: false

