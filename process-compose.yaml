# process-compose.yaml
# Native Rust developer harness orchestrating backend dependencies & live-reloading services
version: "0.5"

processes:
  # Hạ tầng nền tảng (chạy qua Docker Compose)
  infrastructure:
    command: "docker compose -f infra/docker/docker-compose.yml up"
    readiness_probe:
      exec:
        command: "docker compose -f infra/docker/docker-compose.yml ps --status running | grep -q omni-postgres"
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 2

  # Template mẫu cho các Domain Services khi chính thức triển khai:
