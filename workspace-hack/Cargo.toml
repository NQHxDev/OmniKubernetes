[package]
name = "workspace-hack"
version = "0.1.0"
edition = "2024"
publish = false

### BEGIN HAKARI SECTION
[dependencies]
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
axum = { version = "0.8", features = ["macros"] }
axum-core = { version = "0.5", default-features = false, features = ["tracing"] }
base64 = { version = "0.22" }
bitflags = { version = "2", default-features = false, features = ["serde", "std"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = { version = "1" }
crossbeam-utils = { version = "0.8" }
crypto-common = { version = "0.1", default-features = false, features = ["std"] }
digest-93f6ce9d446188ac = { package = "digest", version = "0.10", features = ["mac", "std"] }
digest-a6292c17cd707f01 = { package = "digest", version = "0.11", features = ["alloc", "mac", "oid"] }
either = { version = "1", features = ["serde", "use_std"] }
event-listener = { version = "5" }
fastrand = { version = "2" }
flate2 = { version = "1", features = ["zlib-rs"] }
form_urlencoded = { version = "1" }
futures-channel = { version = "0.3", features = ["sink"] }
futures-io = { version = "0.3" }
futures-sink = { version = "0.3" }
futures-util = { version = "0.3", features = ["channel", "io", "sink"] }
getrandom = { version = "0.4", default-features = false, features = ["std", "sys_rng"] }
hashbrown = { version = "0.16" }
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "service"] }
idna = { version = "1" }
indexmap = { version = "2", features = ["serde"] }
log = { version = "0.4", default-features = false, features = ["std"] }
memchr = { version = "2" }
num-bigint = { version = "0.4" }
num-integer = { version = "0.1", default-features = false, features = ["i128", "std"] }
num-traits = { version = "0.2", features = ["i128"] }
once_cell = { version = "1" }
percent-encoding = { version = "2" }
rand = { version = "0.9" }
redis = { version = "1", default-features = false, features = ["connection-manager", "script", "tokio-rustls-comp"] }
regex = { version = "1" }
regex-automata = { version = "0.4", default-features = false, features = ["dfa-build", "dfa-onepass", "hybrid", "meta", "nfa-backtrack", "perf-inline", "perf-literal", "std", "unicode"] }
regex-syntax = { version = "0.8" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "aws_lc_rs", "ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["aws-lc-rs", "ring", "std"] }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_core = { version = "1", features = ["alloc", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2-93f6ce9d446188ac = { package = "sha2", version = "0.10" }
sha2-a6292c17cd707f01 = { package = "sha2", version = "0.11" }
simd-adler32 = { version = "0.3", default-features = false, features = ["std"] }
slab = { version = "0.4" }
smallvec = { version = "1", default-features = false, features = ["const_new", "serde"] }
sqlx-core = { version = "0.9", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "any", "chrono", "json", "migrate", "offline", "uuid"] }
thiserror = { version = "2" }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tinystr = { version = "0.8", features = ["zerovec"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["fs", "net"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
tonic = { version = "0.14" }
tower = { version = "0.5", default-features = false, features = ["balance", "buffer", "limit", "load-shed", "log", "timeout"] }
tracing = { version = "0.1", features = ["log"] }
tracing-core = { version = "0.1" }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
zeroize = { version = "1", features = ["derive"] }
zerovec = { version = "0.11", default-features = false, features = ["alloc", "derive", "yoke"] }
zlib-rs = { version = "0.6", default-features = false, features = ["std"] }

[build-dependencies]
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
base64 = { version = "0.22" }
bitflags = { version = "2", default-features = false, features = ["serde", "std"] }
