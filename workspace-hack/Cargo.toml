syn-7b89eefb6aaa9bf3 = { package = "syn", version = "3", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
syn-f595c2ba2a3f28df = { package = "syn", version = "2", features = ["extra-traits", "full", "visit", "visit-mut"] }
thiserror = { version = "2" }
tinystr = { version = "0.8", features = ["zerovec"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["fs", "net"] }
tracing = { version = "0.1", features = ["log"] }
tracing-core = { version = "0.1" }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
zeroize = { version = "1", features = ["derive"] }
zerovec = { version = "0.11", default-features = false, features = ["alloc", "derive", "yoke"] }
zlib-rs = { version = "0.6", default-features = false, features = ["std"] }

[target.x86_64-unknown-linux-gnu.dependencies]
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "rustls-native-certs", "tls12"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy"] }
tower = { version = "0.5", default-features = false, features = ["retry"] }

